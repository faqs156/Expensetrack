# Deploy ExpenseTrack Flutter Web PWA to GitHub Pages.
# Repo: faqs156/Expensetrack → https://faqs156.github.io/Expensetrack/
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Ensure SQLite web assets
        run: |
          if [ ! -f web/sqlite3.wasm ] || [ ! -f web/sqflite_sw.js ]; then
            dart run sqflite_common_ffi_web:setup --force || ./tool/setup_web_sqlite.sh
          fi
          test -f web/sqlite3.wasm && test -f web/sqflite_sw.js

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Inject Google OAuth client ID
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -n "${GOOGLE_CLIENT_ID}" ]; then
            sed -i "s/YOUR_GOOGLE_CLIENT_ID\\.apps\\.googleusercontent\\.com/${GOOGLE_CLIENT_ID}/g" web/index.html
            echo "Injected GOOGLE_CLIENT_ID into web/index.html"
          else
            echo "Secret GOOGLE_CLIENT_ID not set — Drive sync disabled in this build"
          fi

      - name: Build web (GitHub Pages subpath)
        # Note: --pwa-strategy is deprecated; offline caching uses web/offline_sw.js
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_ALLOWED_EMAILS: ${{ secrets.GOOGLE_ALLOWED_EMAILS }}
        run: |
          DEFINE_ARGS=()
          if [ -n "${GOOGLE_CLIENT_ID}" ]; then
            DEFINE_ARGS+=(--dart-define="GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}")
          fi
          if [ -n "${GOOGLE_ALLOWED_EMAILS}" ]; then
            DEFINE_ARGS+=(--dart-define="GOOGLE_ALLOWED_EMAILS=${GOOGLE_ALLOWED_EMAILS}")
          else
            echo "Secret GOOGLE_ALLOWED_EMAILS not set — no Google accounts can sign in"
          fi
          flutter build web --release \
            --base-href /Expensetrack/ \
            "${DEFINE_ARGS[@]}"


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
